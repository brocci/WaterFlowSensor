name: Library Validation

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/library-compat@latest
        with:
          library: .

      - uses: arduino/compile-sketches@latest
        with:
          boards: arduino:avr:uno
          sketch-paths: |
            examples